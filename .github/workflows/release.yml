name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: '버전업 종류 선택 (major: 주 버전, minor: 부 버전, patch: 수 버전)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IS_DRAFT_RELEASE: ${{ !(github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'feature-ui-manager') }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Git 설정
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 패키지 버전 업데이트
        id: version
        shell: bash
        run: |
          # draft 릴리스는 npm version으로 기준 버전만 계산한 뒤, beta 버전은 수동 커밋/태그로 마무리합니다.
          if [ "$IS_DRAFT_RELEASE" = "true" ]; then
            # 기준 버전 계산 (예: v1.3.1)
            BASE_VERSION=$(npm version ${{ github.event.inputs.version_type }} --no-git-tag-version)
            BASE_NO_V="${BASE_VERSION#v}"

            # 기존 draft 릴리스 태그 목록을 스냅샷으로 확보 (이후 일괄 삭제용)
            EXISTING_DRAFT_TAGS=$(gh release list --limit 100 --json tagName,isDraft \
              --jq '.[] | select(.isDraft==true) | .tagName')

            # 동일 기준 버전을 가진 기존 draft release에서 가장 큰 beta 번호 탐색
            MAX_BETA=0
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              if [[ "$tag" =~ ^v${BASE_NO_V}-beta([0-9]+)$ ]]; then
                N="${BASH_REMATCH[1]}"
                if [ "$N" -gt "$MAX_BETA" ]; then
                  MAX_BETA=$N
                fi
              fi
            done <<< "$EXISTING_DRAFT_TAGS"

            # 매칭되는 draft가 없으면 beta1부터 시작, 있으면 max+1
            NEXT_BETA=$((MAX_BETA + 1))
            NEW_NO_V="${BASE_NO_V}-beta${NEXT_BETA}"
            NEW_VERSION="v${NEW_NO_V}"

            # package.json을 최종 beta 버전으로 갱신 (npm version은 낮은 semver로의 이동을 거부할 수 있어 직접 수정)
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('./package.json','utf8'));p.version='${NEW_NO_V}';fs.writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');"

            # 베타 번호 산정이 끝났으므로, 기존 draft 릴리스(및 태그)는 모두 정리한다.
            # (이번 워크플로에서 새로 생성될 draft 릴리스만 남기기 위함)
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              echo "Deleting existing draft release: $tag"
              gh release delete "$tag" --cleanup-tag -y || gh release delete "$tag" -y || true
            done <<< "$EXISTING_DRAFT_TAGS"

            # 로컬에 같은 이름의 태그가 남아있을 경우 제거 후 재생성 (태그 충돌 방지)
            git tag -d "$NEW_VERSION" 2>/dev/null || true

            git add package.json package-lock.json
            git commit -m "$NEW_VERSION"
            git tag "$NEW_VERSION"
          else
            # npm version 명령어로 버전을 업데이트합니다. 이 명령어는 package.json 수정과 함께 git commit 및 태그 생성을 수행합니다.
            NEW_VERSION=$(npm version ${{ github.event.inputs.version_type }})
          fi

          echo "새 버전: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 의존성 설치
        run: npm install

      - name: 기존 webview-dist 제거
        run: |
          rm -rf webview-dist
          rm -rf ui/dist || true

      - name: 프로젝트 빌드
        run: npm run build:all

      - name: VS Code 패키지 생성 (.vsix)
        run: npx vsce package --allow-missing-repository

      - name: VSIX 파일 분할 (9MB)
        run: |
          VSIX_FILE=$(ls *.vsix | head -n 1)
          echo "VSIX 파일: $VSIX_FILE"
          split -b 9m "$VSIX_FILE" "$VSIX_FILE.part-"

      - name: 업데이트된 변경사항 푸시
        if: ${{ env.IS_DRAFT_RELEASE != 'true' }}
        run: |
          git push
          git push --tags

      - name: GitHub Release 생성 및 패키지 첨부
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: 🚀 릴리스 ${{ steps.version.outputs.version }}
          body: |
            ## 🚀 새로운 버전이 배포되었습니다! (${{ steps.version.outputs.version }})

            자동 생성된 릴리스 노트를 통해 상세 변경 사항을 확인할 수 있습니다.
            하단의 첨부 파일(`.vsix`)을 다운로드하여 VS Code에 설치하세요.
          generate_release_notes: true
          draft: ${{ env.IS_DRAFT_RELEASE == 'true' }}
          files: |
            *.vsix
            *.vsix.part-*
