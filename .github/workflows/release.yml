name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: '버전업 종류 선택 (major: 주 버전, minor: 부 버전, patch: 수 버전)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IS_DRAFT_RELEASE: ${{ !(github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'feature-ui-manager') }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Git 설정
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 기존 draft 릴리즈 삭제
        run: |
          gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft==true) | .tagName' | while read tag; do
              echo "Deleting draft release: $tag"
              gh release delete "$tag" -y
            done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 패키지 버전 업데이트
        id: version
        run: |
          # draft 릴리스는 npm version으로 기준 버전만 계산한 뒤, beta 버전은 수동 커밋/태그로 마무리합니다.
          if [ "$IS_DRAFT_RELEASE" = "true" ]; then
            BASE_VERSION=$(npm version ${{ github.event.inputs.version_type }} --no-git-tag-version)
            NEW_VERSION=$(npm version "${BASE_VERSION#v}-beta" --no-git-tag-version)
            git add package.json package-lock.json
            git commit -m "$NEW_VERSION"
            git tag "$NEW_VERSION"
          else
            # npm version 명령어로 버전을 업데이트합니다. 이 명령어는 package.json 수정과 함께 git commit 및 태그 생성을 수행합니다.
            NEW_VERSION=$(npm version ${{ github.event.inputs.version_type }})
          fi

          echo "새 버전: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: 의존성 설치
        run: npm install

      - name: 기존 webview-dist 제거
        run: |
          rm -rf webview-dist
          rm -rf ui/dist || true

      - name: 프로젝트 빌드
        run: npm run build:all

      - name: VS Code 패키지 생성 (.vsix)
        run: npx vsce package

      - name: VSIX 파일 분할 (9MB)
        run: |
          VSIX_FILE=$(ls *.vsix | head -n 1)
          echo "VSIX 파일: $VSIX_FILE"
          split -b 9m "$VSIX_FILE" "$VSIX_FILE.part-"

      - name: 업데이트된 변경사항 푸시
        if: ${{ env.IS_DRAFT_RELEASE != 'true' }}
        run: |
          git push
          git push --tags

      - name: GitHub Release 생성 및 패키지 첨부
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: 🚀 릴리스 ${{ steps.version.outputs.version }}
          body: |
            ## 🚀 새로운 버전이 배포되었습니다! (${{ steps.version.outputs.version }})

            자동 생성된 릴리스 노트를 통해 상세 변경 사항을 확인할 수 있습니다.
            하단의 첨부 파일(`.vsix`)을 다운로드하여 VS Code에 설치하세요.
          generate_release_notes: true
          draft: ${{ env.IS_DRAFT_RELEASE == 'true' }}
          files: |
            *.vsix
            *.vsix.part-*
